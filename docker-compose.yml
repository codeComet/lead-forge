# LeadForge — full self-hosted stack for Dokploy / any Docker host.
#
#   cp .env.docker.example .env      # then edit secrets + domains
#   node scripts/gen-secrets.mjs     # fills JWT_SECRET / ANON_KEY / SERVICE_ROLE_KEY / passwords
#   docker compose up -d --build
#
# Services: Postgres + Supabase API (auth/rest/realtime/storage/kong) + Redis
# + Next.js web + BullMQ worker. Studio admin UI is optional:
#   docker compose --profile studio up -d
#
name: leadforge

x-supabase-env: &supabase-common
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  # ── Postgres (Supabase image: ships roles, auth/storage schemas, auth.uid()) ─
  db:
    image: supabase/postgres:17.6.1.136
    container_name: leadforge-db
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
      # init-scripts run once on an empty data dir, before service migrations.
      - ./docker/db/init/98-webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./docker/db/init/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./docker/db/init/99-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./docker/db/init/99-realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  # ── Auth (GoTrue) — email + password ────────────────────────────────
  auth:
    image: supabase/gotrue:v2.189.0
    container_name: leadforge-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 5
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # SMTP (only used when autoconfirm is off, or for password recovery).
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-LeadForge}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  # ── PostgREST — serves the 92 `.from()` queries ─────────────────────
  rest:
    image: postgrest/postgrest:v14.12
    container_name: leadforge-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  # ── Realtime — live audit/lead/email/website_demo updates ───────────
  realtime:
    image: supabase/realtime:v2.102.3
    # Kong's declarative config routes to this exact hostname, and Realtime
    # parses the "realtime-dev" tenant from it — keep both parts verbatim.
    container_name: realtime-dev.supabase-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://127.0.0.1:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 15s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  # ── Storage — screenshots + logos buckets (file backend) ────────────
  storage:
    image: supabase/storage-api:v1.60.4
    container_name: leadforge-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 10s
    volumes:
      - storage-data:/var/lib/storage:Z
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"

  # ── Kong API gateway — the single Supabase endpoint the app talks to ─
  kong:
    image: kong/kong:3.9.1
    container_name: leadforge-kong
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published host ports: on Dokploy, Traefik joins this network and routes
    # to kong:8000 by domain. Host 8000/3000 are taken by Dokploy itself, so
    # publishing collides. Bare-docker users add ports via docker-compose.ports.yml.
    volumes:
      - ./docker/kong.yml:/home/kong/temp.yml:ro,z
      - ./docker/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-changeme}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

  # ── Redis — BullMQ queues ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: leadforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── One-shot: apply app SQL migrations after auth+storage exist ─────
  migrator:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    container_name: leadforge-migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
    environment:
      <<: *supabase-common

  # ── Next.js web app ─────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build → must be public values.
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${SITE_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY:-}
    container_name: leadforge-web
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    # No published host ports on Dokploy (Traefik routes to web:3000 by domain);
    # host 3000 is Dokploy's own dashboard. Bare-docker: docker-compose.ports.yml.
    environment:
      NODE_ENV: production
      PORT: 3000
      # Browser + server both use the public Supabase URL (signed URLs must be
      # reachable from the browser).
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${SITE_URL}
      NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Base URL for tracked links (click tracker + unsubscribe). Point this at a
      # subdomain of the sending domain (https://track.<sending-domain>) routed to
      # web:3000 — a link domain that differs from the From domain reads as bulk
      # mail. Falls back to SITE_URL.
      TRACKING_URL: ${TRACKING_URL:-}
      # List-Unsubscribe headers mark mail as bulk → Gmail Promotions. Only turn
      # on for true bulk sending (5k+/day, where Gmail requires them).
      EMAIL_LIST_UNSUBSCRIBE: ${EMAIL_LIST_UNSUBSCRIBE:-}
      # IMAP — writes a copy of each sent email to the mailbox Sent folder.
      # Optional; falls back to SMTP host/user/pass when blank.
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_SENT_FOLDER: ${IMAP_SENT_FOLDER:-Sent}

  # ── BullMQ worker (audit / insight / proposal / email / website /
  #    warm-up ticks / inbox reply polling) ───────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: leadforge-worker
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Worker is server-only → talk to Kong over the internal network.
      NEXT_PUBLIC_SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MAX_TOKENS: ${GEMINI_MAX_TOKENS:-}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-}
      # Distinct website-template variants generated per industry (default 3).
      WEBSITE_VARIANTS: ${WEBSITE_VARIANTS:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      # Public app URL for links embedded in generated proposals/emails.
      NEXT_PUBLIC_APP_URL: ${SITE_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TRACKING_URL: ${TRACKING_URL:-}
      # IMAP — the worker needs it for two things now: the Sent-folder copy of
      # scheduled sends, and reply detection (polls INBOX to mark leads replied
      # and to confirm warm-up contacts answered).
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_SENT_FOLDER: ${IMAP_SENT_FOLDER:-Sent}
      IMAP_INBOX_FOLDER: ${IMAP_INBOX_FOLDER:-INBOX}
      # Warm-up: where the "warm-up finished" notice goes (defaults to the
      # sending mailbox), and how often one seed contact may be mailed per day.
      WARMUP_NOTIFY_EMAIL: ${WARMUP_NOTIFY_EMAIL:-}
      WARMUP_MAX_PER_CONTACT_PER_DAY: ${WARMUP_MAX_PER_CONTACT_PER_DAY:-1}

  # ── Optional: Supabase Studio admin UI (profile: studio) ────────────
  meta:
    image: supabase/postgres-meta:v0.96.6
    container_name: leadforge-meta
    profiles: ["studio"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: supabase/studio:2026.07.07-sha-a6a04f2
    container_name: leadforge-studio
    profiles: ["studio"]
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
    ports:
      - "${STUDIO_PORT:-3010}:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: LeadForge
      DEFAULT_PROJECT_NAME: LeadForge
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}

volumes:
  db-data:
  db-config:
  storage-data:
  redis-data:
